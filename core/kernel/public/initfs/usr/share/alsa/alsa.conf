#
# ALSA library configuration for ecmaOS (the stock alsa.conf of alsa-lib 1.2.16.1, cut down to what this machine has)
#
# There is one card, 0: the browser's speakers (pcmC0D0p) and microphone (pcmC0D0c), under /dev/snd. Its devices take
# the formats the kernel node offers (8, 16, 24 and 32 bit integers, 32 bit float, 1 to 8 channels, 8000 to 192000 Hz);
# the default device is the card behind the `plug` plugin, so a program may ask for any format or rate and have it
# converted. The device moves samples by read and write, not through memory it shares with the kernel, so `plug` reaches
# it through `mmap_emul`, which gives the converters (and a program that asks for mmap access) the memory they expect. Put your own in ~/.asoundrc or /etc/asound.conf.
#

@hooks [
	{
		func load
		files [
			"/etc/asound.conf|||/usr/etc/asound.conf"
			"~/.asoundrc"
		]
		errors false
	}
]

defaults.namehint.showall off
defaults.namehint.basic on
defaults.namehint.extended off
defaults.ctl.card 0
defaults.pcm.card 0
defaults.pcm.device 0
defaults.pcm.subdevice -1
defaults.pcm.nonblock 1
defaults.pcm.compat 0
defaults.pcm.minperiodtime 5000		# in us
defaults.pcm.ipc_key 5678293
defaults.pcm.ipc_gid audio
defaults.pcm.ipc_perm 0660
defaults.pcm.tstamp_type default

pcm.hw {
	@args [ CARD DEV SUBDEV ]
	@args.CARD {
		type string
		default {
			@func getenv
			vars [
				ALSA_PCM_CARD
				ALSA_CARD
			]
			default {
				@func refer
				name defaults.pcm.card
			}
		}
	}
	@args.DEV {
		type integer
		default {
			@func igetenv
			vars [
				ALSA_PCM_DEVICE
			]
			default {
				@func refer
				name defaults.pcm.device
			}
		}
	}
	@args.SUBDEV {
		type integer
		default {
			@func refer
			name defaults.pcm.subdevice
		}
	}		
	type hw
	card $CARD
	device $DEV
	subdevice $SUBDEV
	hint {
		show {
			@func refer
			name defaults.namehint.extended
		}
		description "Direct hardware device without any conversions"
	}
}

pcm.plughw {
	@args [ CARD DEV SUBDEV ]
	@args.CARD {
		type string
		default {
			@func getenv
			vars [
				ALSA_PCM_CARD
				ALSA_CARD
			]
			default {
				@func refer
				name defaults.pcm.card
			}
		}
	}
	@args.DEV {
		type integer
		default {
			@func igetenv
			vars [
				ALSA_PCM_DEVICE
			]
			default {
				@func refer
				name defaults.pcm.device
			}
		}
	}
	@args.SUBDEV {
		type integer
		default {
			@func refer
			name defaults.pcm.subdevice
		}
	}		
	type plug
	slave.pcm {
		type mmap_emul
		slave.pcm {
			type hw
			card $CARD
			device $DEV
			subdevice $SUBDEV
		}
	}
	hint {
		show {
			@func refer
			name defaults.namehint.extended
		}
		description "Hardware device with all software conversions"
	}
}

pcm.plug {
	@args [ SLAVE ]
	@args.SLAVE {
		type string
	}
	type plug
	slave.pcm $SLAVE
}

pcm.null {
	type null
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "Discard all samples (playback) or generate zero samples (capture)"
	}
}

ctl.hw {
	@args [ CARD ]
	@args.CARD {
		type string
		default {
			@func getenv
			vars [
				ALSA_CTL_CARD
				ALSA_CARD
			]
			default {
				@func refer
				name defaults.ctl.card
			}
		}
	}
	type hw
	card $CARD
	hint.description "Direct control device"
}

pcm.default {
	type plug
	slave.pcm {
		type mmap_emul
		slave.pcm "hw:0,0"
	}
	hint {
		show on
		description "Default Audio Device"
	}
}
pcm.sysdefault pcm.default

ctl.default {
	type hw
	card 0
}
ctl.sysdefault ctl.default
