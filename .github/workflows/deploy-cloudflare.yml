name: Deploy to Cloudflare

# Builds the kernel site and publishes it as Workers static assets (hosting/cloudflare).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed kernel .env from template
        run: cp core/kernel/.env.template core/kernel/.env

      - name: Build
        run: pnpm build --filter @ecmaos/kernel

      - name: Hosting configs
        run: node hosting/check.mjs

      - name: Install cf
        working-directory: hosting/cloudflare
        run: npm ci

      - name: Deploy
        working-directory: hosting/cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
