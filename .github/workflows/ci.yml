name: CI

on:
  push:
    branches: ['feat/1.0.0', 'feat/1.0.0-**', 'main']
  pull_request:
    branches: ['feat/1.0.0', 'main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Seed kernel .env from template
        run: cp core/kernel/.env.template core/kernel/.env

      # Before the build, which rebuilds the tarball itself and would hide one that was never committed
      - name: Initfs is up to date
        run: pnpm check:initfs

      # Package manifests: one version of each dependency across the workspace, dependencies sorted (pnpm fix:repo fixes it)
      - name: Workspace manifests
        run: pnpm lint:repo

      - name: Build
        run: pnpm build

      - name: Typecheck error-budget ratchet
        run: node scripts/typecheck-ratchet.mjs

      - name: Typecheck the service worker, the Node host and peer
        run: pnpm --filter @ecmaos/swapi --filter @ecmaos/node --filter @ecmaos/peer run typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  node:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Windows is best-effort: its failures are reported, and do not fail the run
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed kernel .env from template
        run: cp core/kernel/.env.template core/kernel/.env

      - name: Build the Node host and what it depends on
        run: pnpm turbo run build --filter=@ecmaos/node...

      - name: Test the built bundle (smoke, persistence, lifecycle, terminal on a pty)
        run: pnpm --filter @ecmaos/node exec vitest run

      - name: Run the kernel tests on Node, without a DOM
        run: pnpm --filter @ecmaos/kernel test:node

  browser:
    name: the site in headless Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Seed kernel .env from template
        run: cp core/kernel/.env.template core/kernel/.env

      - name: Build the site and what it depends on
        run: pnpm turbo run build --filter=@ecmaos/kernel...

      - name: Chromium for Playwright
        run: pnpm --filter @ecmaos/kernel exec playwright install --with-deps chromium

      # Boots the built site from an empty profile, types at the prompt, runs a WASI Preview 2 component, and shows,
      # clicks and closes an OpenGL ES window
      - name: Test in the browser
        run: pnpm --filter @ecmaos/kernel test:e2e

      - name: Screenshots of the failed steps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: core/kernel/test-results/
          if-no-files-found: ignore
