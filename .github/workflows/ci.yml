name: CI

on:
  push:
    branches: ['feat/1.0.0', 'feat/1.0.0-**', 'main']
  pull_request:
    branches: ['feat/1.0.0', 'main']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Seed kernel .env from template
        run: cp core/kernel/.env.template core/kernel/.env

      # Advisory until feat/1.0.0-dep-hygiene lands: `pnpm build` currently fails
      # in @ecmaos/coreutils because core/utils still resolves @zenfs/core 2.4.4
      # against the kernel's 2.7.2. dep-hygiene removes the drift and drops
      # `continue-on-error` here.
      - name: Build
        run: pnpm build
        continue-on-error: true

      - name: Typecheck error-budget ratchet
        run: node scripts/typecheck-ratchet.mjs

      - name: Test
        run: pnpm --filter @ecmaos/kernel test
