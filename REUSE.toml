# Generated by scripts/reuse-toml.mjs (pnpm sync:reuse) from the programs' manifest.json files: do not edit by hand.
# The license of every file in the repository, for `reuse lint`. See CONTRIBUTING.md and the Licensing section of the README.
version = 1
SPDX-PackageName = "ecmaOS"
SPDX-PackageSupplier = "Jay Mathis <code@mathis.network>"
SPDX-PackageDownloadLocation = "https://github.com/ecmaos/ecmaos"

# ecmaOS: everything, unless a file says otherwise in its own SPDX header or an annotation below does
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2024-2026 Jay Mathis <code@mathis.network>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Reproductions of other projects' license texts and notices, kept so a license that asks for its notice gets it
[[annotations]]
path = ["**/licenses/**", "core/kernel/public/initfs/usr/share/licenses/**"]
precedence = "override"
SPDX-FileCopyrightText = "the authors of each project, named in each text"
SPDX-License-Identifier = "LicenseRef-Upstream-License-Notice"

# The notices and offers of source that ecmaOS wrote itself, among those texts
[[annotations]]
path = ["**/licenses/**/SOURCE", "**/licenses/**/README.md", "**/licenses/**/README", "**/licenses/**/COPYRIGHT.txt", "core/kernel/public/initfs/usr/share/licenses/@ecmaos/kernel/**", "core/*/licenses/ecmaos/**", "core/utils*/licenses/ecmaos/**"]
precedence = "override"
SPDX-FileCopyrightText = "2024-2026 Jay Mathis <code@mathis.network>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# ecmaOS's own license texts (the MIT and Apache texts themselves are not copyrightable additions)
[[annotations]]
path = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]
precedence = "override"
SPDX-FileCopyrightText = "2024-2026 Jay Mathis <code@mathis.network>"
SPDX-License-Identifier = "MIT OR Apache-2.0"

